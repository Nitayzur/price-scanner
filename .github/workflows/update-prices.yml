name: update prices
on:
  schedule:
    # Osher Ad publishes the day's files around 08:00 Israel time; run twice so a late file or a failed run is caught
    - cron: "15 7 * * *"   # 10:15 summer / 09:15 winter
    - cron: "15 13 * * *"  # 16:15 summer / 15:15 winter
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_prices.py
      - name: commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "update prices" && git push)
